<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tur-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="55%" stop-color="#13294b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="tur-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="tur-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- 背景圓角盾牌底 -->
  <rect width="512" height="512" rx="96" fill="url(#tur-bg)"/>
  <rect x="18" y="18" width="476" height="476" rx="80" fill="none" stroke="url(#tur-gold)" stroke-width="10" opacity="0.85"/>

  <!-- 台灣山稜線剪影（象徵超馬越野精神） -->
  <path d="M56 198 L138 116 L196 164 L262 84 L334 156 L388 122 L456 198" fill="none" stroke="url(#tur-cyan)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <path d="M76 206 L146 144 L200 182 L262 114 L328 176 L382 146 L436 206" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>

  <!-- TUR 主字標 -->
  <text x="256" y="318" text-anchor="middle" font-family="Impact, 'Arial Black', 'Segoe UI', sans-serif" font-weight="900" font-size="162" letter-spacing="8" fill="#ffffff">TUR</text>

  <!-- 跑道能量線 -->
  <rect x="78" y="346" width="356" height="12" rx="6" fill="url(#tur-gold)"/>
  <rect x="130" y="368" width="252" height="6" rx="3" fill="url(#tur-cyan)" opacity="0.9"/>

  <!-- TAIWAN ULTRA RUNNERS 品牌字 -->
  <text x="256" y="424" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="31" letter-spacing="3.5" fill="#fde68a">TAIWAN ULTRA RUNNERS</text>
</svg>
